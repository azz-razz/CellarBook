<script>// Web build 2.0.0: public GitHub Pages copy. Privacy-stripped by design --
// empty seed, anonymised taste profile, no personal file paths. The real
// cellar arrives from Dropbox after connecting, on your device only.
const {
  useState,
  useEffect,
  useRef
} = React;

// ================================================================
// CELLARBOOK v1 — architecture agreed 2026-08-08
// Master store: this app's persistent storage (personal scope).
// Project docs = snapshots, refreshed via Export.
// Photo intake: in-app Claude label read -> user verification -> commit.
// Pairing engine: Claude call with taste profile + live inventory.
// Provenance discipline: every window/pairing tagged verified|estimate.
// ================================================================

const APP_VERSION = "2.0.0 web";
const TYPE_META = {
  red: {
    label: "Red",
    color: "#A63D4E"
  },
  white: {
    label: "White",
    color: "#C9B26B"
  },
  rose: {
    label: "Rosé",
    color: "#D08770"
  },
  sparkling: {
    label: "Sparkling",
    color: "#D8C08A"
  },
  port: {
    label: "Port/Sweet",
    color: "#B07A3F"
  }
};

// Physical model corrected 2026-08-14 from the Dropbox master's own note.
// The kitchen fridge is not one bucket: it has a wine rack with an ordered
// left-to-right sequence, and a door. v1.5.4 and earlier collapsed both into
// "kitchen", which is why the app could not show you what you actually have.
// Location model, v2.0.0 (ruled 2026-08-21). Every wine-fridge shelf and the
// kitchen rack is an ORDERED run of 4 slots carrying pos 1-4, left to right.
// Through v1.7.2 only krack was ordered and shelf order lived in free text --
// the same fault as the Maturity tab, one field over. "kitchen" is retired:
// it collapsed the drawer into a vague bucket. kdrawer and library replace it.
const SLOTS = 4;
const LOCATIONS = [{
  id: "wf1",
  group: "Wine fridge",
  label: "Shelf 1 (top)",
  ordered: true,
  slots: SLOTS
}, {
  id: "wf2",
  group: "Wine fridge",
  label: "Shelf 2",
  ordered: true,
  slots: SLOTS
}, {
  id: "wf3",
  group: "Wine fridge",
  label: "Shelf 3",
  ordered: true,
  slots: SLOTS
}, {
  id: "wf4",
  group: "Wine fridge",
  label: "Shelf 4 (bottom)",
  ordered: true,
  slots: SLOTS
}, {
  id: "krack",
  group: "Kitchen fridge",
  label: "Wine rack (left to right)",
  ordered: true,
  slots: SLOTS
}, {
  id: "kdoor",
  group: "Kitchen fridge",
  label: "Door"
}, {
  id: "kdrawer",
  group: "Kitchen fridge",
  label: "Vegetable drawer"
}, {
  id: "library",
  group: "Library",
  label: "Library shelf (room temperature)"
}, {
  id: "basement",
  group: "Basement",
  label: "Basement cellar"
}, {
  id: "unassigned",
  group: "Just added",
  label: "Assign a location"
}, {
  id: "unconfirmed",
  group: "Unconfirmed",
  label: "Not seen in any photo"
}];
const LOC_BY_ID = Object.fromEntries(LOCATIONS.map(l => [l.id, l]));
const locLabel = id => {
  const l = LOC_BY_ID[id];
  return l ? l.group + (l.group !== l.label ? " - " + l.label : "") : id;
};

// Groups that are real stock. "Unconfirmed" is deliberately excluded: those
// bottles are open questions, not inventory, and must never inflate a count
// or reach the sommelier.
const STOCK_GROUPS = ["Wine fridge", "Kitchen fridge", "Library", "Basement", "Just added"];

// The master file carries a top-level "note" describing the physical model in
// plain language, for whoever reads cellarbook.json outside this app. v1.5.7
// dropped it on every push: the payload was built without it, so the first
// sync would have deleted the only record of the Wines folder path and the
// verbatim rack statement. v1.5.8 carries it through pull, cache, push and

// ================= Drinking windows, schema 3 =================
// window.status is gone. Every maturity decision is COMPUTED from
// from/to/unknown plus the clock, and never stored, so it cannot go stale.
// Today is a fractional year read at render time: 21 Aug 2026 -> 2026.64.
// Open the app in 2036 and the marker has moved ten years by itself.
function nowFrac() {
  const d = new Date(),
    y = d.getFullYear();
  const s = new Date(y, 0, 1),
    e = new Date(y + 1, 0, 1);
  return y + (d - s) / (e - s);
}

// Normalises a window from ANY source: seed, local cache, Dropbox master,
// restored backup, or a record written by a stale v1.7.x device still in the
// wild. A legacy status string is never mined for a year. It becomes
// Unclassified, visibly, so it gets corrected rather than guessed at.
function normWindow(w) {
  const s = w && typeof w === "object" ? w : {};
  const num = v => typeof v === "number" && isFinite(v) ? Math.round(v) : null;
  const legacy = typeof s.status === "string" && s.from === undefined && s.to === undefined;
  return {
    from: legacy ? null : num(s.from),
    to: legacy ? null : num(s.to),
    unknown: legacy ? true : s.unknown === true,
    decant: num(s.decant),
    detail: typeof s.detail === "string" && s.detail ? s.detail : legacy ? String(s.status) : "",
    source: s.source === "verified" ? "verified" : s.source === "unknown" ? "unknown" : "estimate",
    legacy: legacy
  };
}

// Exactly one bucket for every record, always. The branches are exhaustive by
// construction, which is the whole point: the Mirafiore failure was a bottle
// that matched no branch and silently vanished. "Closing" is a sub-state of
// Ready, not a fourth state -- a bottle in Drink soon is in its window.
const BUCKETS = ["Closing", "Drinkable", "Not yet", "Over", "No window"];
const IN_WINDOW = ["Closing", "Drinkable"];
function windowBucket(w, year) {
  const n = normWindow(w);
  const yi = Math.floor(year === undefined ? nowFrac() : year);
  if (n.unknown) return "No window";
  if (n.from !== null && yi < n.from) return "Not yet";
  if (n.to !== null && yi > n.to) return "Over";
  if (n.to !== null && n.to - yi <= 1) return "Closing";
  return "Drinkable";
}
const BUCKET_COLOR = {
  "Closing": "#D9A0A8",
  "Drinkable": "#9FC9A8",
  "Not yet": "#C9A87C",
  "Over": "#C08A8A",

};

// The numbered range, in words, for every shape the schema allows.
function windowRange(w) {
  const n = normWindow(w);
  if (n.unknown) return "Not set";
  if (n.from === null && n.to === null) return "Open ended";
  if (n.from === null) return "Ready now \u2013 " + n.to;
  if (n.to === null) return "From " + n.from + ", open ended";
  return n.from + " \u2013 " + n.to;
}

// Days of useful life once opened. Absent is NOT zero. A null max already
// means no practical limit, so min-with-null-max says nothing that both-null
// does not: both read open ended (ruled 2026-08-21 on the 1968 Calvados,
// then extended 2026-08-21 to min-with-null-max).
function openDaysText(o) {
  if (!o || typeof o !== "object") return "";
  if (!("min" in o) && !("max" in o)) return "";
  const has = v => typeof v === "number" && isFinite(v);
  const hasMin = has(o.min),
    hasMax = has(o.max);
  if (!hasMax) {
    if (hasMin) {
      try {
        console.warn("CellarBook: openDays.min with null max carries no advice", o);
      } catch (e) {}
    }
    return "Open ended once opened";
  }
  if (!hasMin) {
    try {
      console.warn("CellarBook: openDays has max without min", o);
    } catch (e) {}
    return "Up to " + o.max + " days once opened";
  }
  return o.min + " to " + o.max + " days once opened";
}

// One migration path for every source of state: seed, local cache, Dropbox
// master, restored backup. Idempotent by id, and gated on the schema number
// so a bottle you deliberately clear does not come back on the next load.
// Normalisation only. v1.5.4 silently injected the unresolved bottles and the
// historic drunk log here, which would have rewritten a master that another
// surface is actively maintaining. Both are now explicit buttons in Sync.
function migrate(state) {
  const s = {
    bottles: [],
    consumed: [],
    pairings: [],
    ...(state || {})
  };
  // Windows are normalised on the way in, from every source, so no downstream
  // code ever has to ask whether it is looking at a v2 or a v3 record.
  s.bottles = (s.bottles || []).map(b => ({
    ...b,
    window: normWindow(b.window)
  }));
  s.bottles = (s.bottles || []).filter(b => !REMOVED_IDS.includes(b.id));
  s.consumed = s.consumed || [];
  s.pairings = s.pairings || [];
  return s;
}

// Opt-in reconciliations. Each returns a new bottles/consumed pair and says
// how many entries it would add, so nothing happens without you asking.
function addUnresolved(bottles, consumed) {
  const have = new Set(bottles.map(b => b.id));
  const drunk = new Set(consumed.map(c => String(c.id).split("-")[0]));
  const add = UNRESOLVED.filter(u => !have.has(u.id) && !drunk.has(u.id));
  return {
    bottles: [...bottles, ...add],
    added: add.length
  };
}
function addHistoricLog(consumed) {
  const have = new Set(consumed.map(c => c.id));
  const add = HISTORIC_CONSUMED.filter(h => !have.has(h.id));
  return {
    consumed: [...consumed, ...add],
    added: add.length
  };
}

function validateState(d) {

  if (!Array.isArray(d.bottles)) throw new Error("no bottles array");
  if (d.consumed && !Array.isArray(d.consumed)) throw new Error("consumed is not an array");
  if (d.pairings && !Array.isArray(d.pairings)) throw new Error("pairings is not an array");
  return d;
}

function failReason(e) {
  const m = String(e && e.message || e || "");
  if (/Failed to fetch|NetworkError|load failed|ERR_/i.test(m)) return "Could not reach the model API from this artifact. The most likely cause is that the Dropbox connector is not granted to it yet. Grant it in the desktop app, then Pull.";

  if (/output budget/i.test(m)) return m + " The cellar has outgrown the push budget; raise it before saving again.";
  return m.slice(0, 200) || "unknown error";
}

const DBX_FILE = "/001 AYAY/004 PERSONAL/Wine & Food/CellarBook/cellarbook.json";
// ---------------- Standalone Dropbox client (v1.6.0) ----------------
// Talks to Dropbox's own HTTP API directly, per Dropbox's documented flow for
// browser apps: OAuth 2 code flow with PKCE, no redirect (the user pastes the
// code Dropbox shows them), token_access_type=offline for a refresh token.
// Push is a single atomic overwrite — no more delete-then-create.
const LS = {
  appKey: "cb-dbx-appkey",
  refresh: "cb-dbx-refresh",
  access: "cb-dbx-access",
  verifier: "cb-dbx-verifier",
  claude: "cb-claude-key"
};
const PULL_DEADLINE_MS = 30000; // direct calls are quick; this is generous

function dbxConnected() {
  try {
    return !!(localStorage.getItem(LS.refresh) || localStorage.getItem(LS.access));
  } catch {
    return false;
  }
}
function getClaudeKey() {
  try {
    return (localStorage.getItem(LS.claude) || "").trim();
  } catch {
    return "";
  }
}
function randVerifier() {
  const a = new Uint8Array(48);
  crypto.getRandomValues(a);
  return Array.from(a, b => ("0" + b.toString(16)).slice(-2)).join("");
}
async function sha256b64url(str) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function dbxBuildAuthUrl() {
  const appKey = (localStorage.getItem(LS.appKey) || "").trim();
  if (!appKey) throw new Error("Enter your Dropbox app key first.");
  const v = randVerifier();
  localStorage.setItem(LS.verifier, v);
  let challenge, method;
  try {
    challenge = await sha256b64url(v);
    method = "S256";
  } catch {
    challenge = v;
    method = "plain";
  } // very old browsers only
  return "https://www.dropbox.com/oauth2/authorize?client_id=" + encodeURIComponent(appKey) + "&response_type=code&token_access_type=offline&code_challenge=" + encodeURIComponent(challenge) + "&code_challenge_method=" + method;
}
async function dbxTokenCall(params) {
  const r = await fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: new URLSearchParams(params).toString()
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error_description || d.error || "Dropbox token call failed (" + r.status + ")");
  return d;
}
async function dbxExchangeCode(code) {
  const d = await dbxTokenCall({
    code: code.trim(),
    grant_type: "authorization_code",
    client_id: (localStorage.getItem(LS.appKey) || "").trim(),
    code_verifier: localStorage.getItem(LS.verifier) || ""
  });
  if (d.access_token) localStorage.setItem(LS.access, d.access_token);
  if (d.refresh_token) localStorage.setItem(LS.refresh, d.refresh_token);
  if (!d.refresh_token) throw new Error("Connected, but Dropbox returned no refresh token; the connection will expire in hours. Report this.");
}
async function dbxRefreshAccess() {
  const rt = localStorage.getItem(LS.refresh);
  if (!rt) throw new Error("not connected to Dropbox — open Sync and connect");
  const d = await dbxTokenCall({
    grant_type: "refresh_token",
    refresh_token: rt,
    client_id: (localStorage.getItem(LS.appKey) || "").trim()
  });
  localStorage.setItem(LS.access, d.access_token);
  return d.access_token;
}
function dbxDisconnect() {
  [LS.refresh, LS.access, LS.verifier].forEach(k => {
    try {
      localStorage.removeItem(k);
    } catch {}
  });
}
async function dbxContentCall(endpoint, arg, body) {
  const go = t => fetch("https://content.dropboxapi.com/2/files/" + endpoint, {
    method: "POST",
    headers: Object.assign({
      Authorization: "Bearer " + t,
      "Dropbox-API-Arg": JSON.stringify(arg)
    }, body != null ? {
      "Content-Type": "application/octet-stream"
    } : {}),
    body
  });
  let tok = localStorage.getItem(LS.access);
  let r = tok ? await go(tok) : {
    status: 401,
    ok: false,
    text: async () => "no access token"
  };
  if (r.status === 401) {
    tok = await dbxRefreshAccess();
    r = await go(tok);
  }
  return r;
}
async function dbxPush(json) {
  if (!dbxConnected()) throw new Error("not connected to Dropbox — open Sync and connect");
  const r = await dbxContentCall("upload", {
    path: DBX_FILE,
    mode: "overwrite",
    mute: true
  }, json);
  if (!r.ok) {
    const t = await r.text();
    throw new Error("Dropbox upload failed: " + t.slice(0, 180));
  }
}
async function dbxPull(timeoutMs = PULL_DEADLINE_MS) {
  if (!dbxConnected()) throw new Error("not connected to Dropbox — open Sync and connect");
  const r = await dbxContentCall("download", {
    path: DBX_FILE
  }, null);
  if (r.status === 409) {
    const t = await r.text();
    if (/not_found/.test(t)) return null;
    throw new Error("Dropbox: " + t.slice(0, 180));
  }
  if (!r.ok) {
    const t = await r.text();
    throw new Error("Dropbox download failed: " + t.slice(0, 180));
  }
  return JSON.parse(await r.text()); // throws loudly — caller keeps local state
}
